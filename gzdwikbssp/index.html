<!doctype html>
<html lang="nl" data-version="eeeb01684854">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Beveiligd voorbeeld</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f3f1;color:#16181b}
main{width:min(100%,26rem);background:#fff;border:1px solid #e2e2de;border-radius:16px;padding:2rem 1.6rem;box-shadow:0 24px 60px -32px rgb(0 0 0/.35)}
h1{font-size:1.5rem;margin:0 0 .4rem;letter-spacing:-.01em}p{margin:0 0 1.2rem;color:#4b5058;line-height:1.5}
label{display:block;font-weight:600;margin-bottom:.4rem}
input{width:100%;font:inherit;font-size:1.05rem;padding:.8rem .9rem;border:1px solid #c9c9c4;border-radius:10px}
input:focus{outline:3px solid #2563eb;outline-offset:2px}
button{width:100%;margin-top:1rem;font:inherit;font-weight:700;padding:.85rem;border:0;border-radius:10px;background:#16181b;color:#fff;cursor:pointer;transition:transform .15s}
button:hover{transform:scale(1.02)}button:disabled{opacity:.6;cursor:wait}
.status{min-height:1.5em;margin:1rem 0 0;font-weight:600}.status.error{color:#b42318}
.resume{margin-top:1.25rem;padding-top:1rem;border-top:1px solid #eee;font-size:.95rem}
.resume a{color:#16181b;font-weight:700}.linklike{background:none;color:#4b5058;width:auto;padding:0;margin:0 0 0 .75rem;font-weight:500;text-decoration:underline}
.small{font-size:.8125rem;color:#6b7079;margin:1.25rem 0 0}
</style>
</head>
<body>
<main>
<h1>Beveiligd voorbeeld</h1>
<p>Dit ontwerpvoorstel is alleen bedoeld voor de ontvanger. Vul het wachtwoord in dat je hebt ontvangen.</p>
<form id="unlock" novalidate>
<label for="password">Wachtwoord</label>
<input id="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
<button id="submit" type="submit">Bekijk het voorbeeld</button>
<p id="status" class="status" role="status" aria-live="polite"></p>
</form>
<div class="resume" hidden><a id="resume" href="#">Verder naar het voorbeeld</a><button id="lock" class="linklike" type="button">Vergrendelen op dit apparaat</button></div>
<p class="small">Het wachtwoord verlaat je apparaat niet: de inhoud wordt in je eigen browser ontsleuteld. Er worden geen cookies of trackers gebruikt.</p>
</main>
<script src="loader.js"></script>
</body>
</html>
